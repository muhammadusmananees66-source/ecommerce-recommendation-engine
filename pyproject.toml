[project]
name = "rag-recommendation-2026"
version = "1.0.0"
description = "RAG + hybrid recommendation engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.4.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "joblib>=1.4.0",
    "tenacity>=8.5.0",
    "prometheus-client>=0.20.0",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
]

# Heavy ML backends are optional so the core app (API, RAG with tfidf
# embeddings, recommender with numpy matrix factorization) installs and
# boots in seconds, with no torch/CUDA download required for CI or for a
# quick local run. Install the group you need for production.
[project.optional-dependencies]
semantic-embeddings = [
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
]
nli-groundedness = [
    "transformers>=4.44.0",
    "torch>=2.4.0",
]
vector-db = [
    "pinecone-client>=5.0.0",
]
llm-providers = [
    "openai>=1.40.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.8.0",
]
mlops = [
    "mlflow>=2.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"