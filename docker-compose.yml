version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ENVIRONMENT: development
      RAG_AUTH__SECRET_KEY: "dev-secret-change-me"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped