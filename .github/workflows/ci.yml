name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: mypy src --ignore-missing-imports || true  # advisory, not yet a hard gate

  unit-tests:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: pip install pyarrow  # for parquet fixtures/scripts
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  rag-evaluation:
    name: RAG Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt && pip install pyarrow
      - run: python scripts/generate_sample_data.py
      - name: Run RAG evaluation (deploy gate)
        run: |
          python scripts/evaluate_rag.py \
            --test-data data/rag_test.parquet \
            --seed-items data/items.parquet \
            --threshold-faithfulness 0.3 \
            --threshold-relevancy 0.15 \
            --output-file rag-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-evaluation
          path: rag-evaluation.json

  docker-build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [rag-evaluation]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/rag-recommendation:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rag-recommendation:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rag-recommendation:latest

  # ------------------------------------------------------------------
  # Deploy jobs are SKIPPED (not failed) when no cluster is configured
  # yet. Set the KUBE_CONFIG_STAGING / KUBE_CONFIG_PRODUCTION repo
  # secrets once you actually provision a cluster -- until then this
  # job reports as "skipped", which is the correct state, not a failure.
  # See README.md "Kubernetes deployment" section for how to provision
  # a cluster and populate these secrets.
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Check cluster credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG_STAGING secret is not set -- skipping deploy. This is expected until a staging cluster is provisioned; see README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.check.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
          IMAGE: ${{ needs.docker-build.outputs.image }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl cluster-info  # fail fast with a clear error if the kubeconfig is bad
          sed "s|__IMAGE__|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/rag-recommendation -n production --timeout=180s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # needs: [deploy-staging]
    needs: [docker-build]   # to get prodcution base don docker build 
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Check cluster credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG_PRODUCTION secret is not set -- skipping deploy. This is expected until a production cluster is provisioned; see README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.check.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          # IMAGE: ghcr.io/${{ github.repository_owner }}/rag-recommendation:${{ github.ref_name }}
          IMAGE: ${{ needs.docker-build.outputs.image }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl cluster-info
          sed "s|__IMAGE__|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/rag-recommendation -n production --timeout=180s
